name: CI

on:
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install npm packages
        run: npm install
        working-directory: frontend
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      - name: Run tests
        run: npm run test
        working-directory: frontend

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devbaord-frontend:latest
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Go Lang
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache-dependeny-path: 'go.sum'

      - name: Run Go formatter
        run: go fmt
        working-directory: backend

      - name: Run go vetter
        run: go vet
        working-directory: backend

      - name: Run Go test
        run: go test
        working-directory: backend

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devbaord-backend:latest

      