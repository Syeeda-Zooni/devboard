name: CI

on:
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install npm packages
        run: npm install
        working-directory: frotend
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      - name: Run tests
        run: npm run test
        working-directory: frontend

      - name: Docker login
        uses: docker/login-actions@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker build and push
        uses: docker/build-push-actions@v7
        with:
          context: ./frontend
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devbaord-frontend:latest